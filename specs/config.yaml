schema: spec-driven

project: auditax
description: |
  Flexible entity audit logging library for .NET 10+ supporting Dapper and EF Core with SQL Server and PostgreSQL

context: |
  Stack: .NET 10 / C# 14, Dapper, EF Core, SQL Server, PostgreSQL
  Architecture: Multi-package NuGet library (5 packages)
  Testing: xUnit
  Style: TreatWarningsAsErrors, strict nullable

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected domains
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Delta specs use ADDED/MODIFIED/REMOVED sections
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase (foundation, core, integration, testing)
    - Hierarchical numbering (1.1, 1.2)
    - Small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Merge delta specs into main specs
    - Warn before merging destructive deltas
